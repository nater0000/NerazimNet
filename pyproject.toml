[build-system]
requires = ["setuptools>=61.0", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "NerazimNet"
version = "0.1.4"
authors = [
  { name="Nathan R", email="moso.nate.r@gmail.com" },
]
description = "A decentralized hostname router for HTTPS over FRP/QUIC tunnels using Syncthing"
readme = "docs/readme.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

# Runtime dependencies (replaces requirements.txt)
dependencies = [
    "fabric>=3.2.2",
    "invoke>=2.2.0",
    "customtkinter",
    "syncthing2",
    "diff-match-patch",
    "cryptography",
    "requests",
    "watchdog",
    "qrcode",
    "Pillow",
    "PyInstaller",
    "toml",
    "pystray",
    "emoji",
    "jinja2",
]

[project.urls]
"Homepage" = "https://github.com/nater0000/nerazimnet"

[tool.setuptools]
packages = ["src"]

# Custom tool section to define script paths
[tool.nerazimnet]
build_script = "scripts/build.py"
installer_script = "scripts/create_installer.iss"
# Add the Syncthing version here
syncthing_version = "v1.29.1"
# FRP version (bundled frpc.exe client and provisioned frps server binary)
frp_version = "v0.71.0"
