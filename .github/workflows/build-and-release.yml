name: Build and Release ⚙️🚀

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g., v1.0.0)

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        run: pip install '.[dev]'

      - name: Run tests 🧪
        run: python -m pytest tests/ -x -q

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install . # Installs from pyproject.toml

      - name: Install Inno Setup 🛠️
        run: |
          choco install innosetup
          # Add Inno Setup to the PATH
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Run build script 🏗️
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build.py # Runs PyInstaller

      - name: Create Installer 📦
        run: python -u scripts/create_installer.py # Stamps version from pyproject.toml via ISCC /D

      - name: Upload installer artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-windows-${{ github.ref_name }}
          path: Output/

  build-posix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install .

      - name: Run build script 🏗️
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build.py # Runs PyInstaller

      - name: Package artifact 📦
        shell: bash
        run: |
          mkdir -p OutDist
          if [ "$RUNNER_OS" == "macOS" ]; then
            cd dist && zip -r ../OutDist/NerazimNet_macOS.zip NerazimNet.app && cd ..
          else
            # Linux: tarball with binary + .desktop shortcut + icon
            cp resources/images/nerazimnet_logo.png dist/nerazimnet.png
            cat > dist/nerazimnet.desktop <<'EOF'
          [Desktop Entry]
          Name=NerazimNet
          Comment=FRP-based reverse tunnel manager
          Exec=nerazimnet
          Icon=nerazimnet
          Type=Application
          Categories=Network;
          EOF
            tar -czf OutDist/NerazimNet_Linux.tar.gz -C dist NerazimNet nerazimnet.png nerazimnet.desktop
          fi

      - name: Upload package artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-${{ runner.os }}-${{ github.ref_name }}
          path: OutDist/

  release:
    needs: [test, build-windows, build-posix]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Download all build artifacts 📥
        uses: actions/download-artifact@v4
        with:
          pattern: nerazimnet-*-${{ github.ref_name }}
          merge-multiple: true
          path: release-assets/

      - name: List release assets 🔎
        run: ls -R release-assets

      - name: Create Release 📨
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          # Use the tag that triggered the workflow
          tag: ${{ github.ref_name }}
          # Create a release name based on the tag
          name: Release ${{ github.ref_name }}
          # Set draft=false and prerelease=false for automatic publishing
          draft: false
          prerelease: false
          # Upload the installer, macOS zip, Linux tarball, and this tag's changelog
          artifacts: "release-assets/*, docs/changelog-${{ github.ref_name }}.md"
          # Append the tag-name to the changelog filename
          bodyFile: "docs/changelog-${{ github.ref_name }}.md"
