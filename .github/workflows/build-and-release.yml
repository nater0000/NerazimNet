name: Build and Release ⚙️🚀

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g., v1.0.0)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Needed to create releases

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install . # Installs from pyproject.toml

      - name: Install Inno Setup 🛠️
        run: |
          choco install innosetup
          # Add Inno Setup to the PATH
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Run build script 🏗️
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build.py # Runs PyInstaller

      - name: Create Installer 📦
        run: python -u scripts/create_installer.py # Stamps version from pyproject.toml via ISCC /D

      # Debug step (Moved to after 'Create Installer')
      - name: List files for debugging 🔎
        run: |
          ls -R dist
          ls -R resources
          ls -R Output
        shell: bash

      # Upload the raw PyInstaller output as an artifact for debugging
      - name: Upload application artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-app-${{ github.ref_name }} # Include tag name for clarity
          path: dist/

      - name: Create Release 📨
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          # Use the tag that triggered the workflow
          tag: ${{ github.ref_name }}
          # Create a release name based on the tag
          name: Release ${{ github.ref_name }}
          # Set draft=false and prerelease=false for automatic publishing
          draft: false
          prerelease: false
          # Upload only the final installer from the Output directory to the release assets
          artifacts: "Output/*.exe, docs/*"
          # Append the tag-name to the changelog filename
          bodyFile: "docs/changelog-${{ github.ref_name }}.md"
