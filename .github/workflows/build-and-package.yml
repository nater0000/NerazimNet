name: Build and Package ⚙️📦

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install .

      - name: Install Inno Setup 🛠️
        run: |
          choco install innosetup
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Run build script 🏗️
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build.py

      - name: Create Installer 📦
        run: python -u scripts/create_installer.py # Stamps version from pyproject.toml via ISCC /D

      - name: Upload installer artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-installer-windows
          path: Output/

      - name: Upload application artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-app-windows
          path: dist/

  build-posix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code 💻
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies ✨
        env:
          PYTHONUNBUFFERED: "1"
        run: pip install .

      - name: Run build script 🏗️
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/build.py

      - name: Package artifact 📦
        shell: bash
        run: |
          mkdir -p OutDist
          if [ "$RUNNER_OS" == "macOS" ]; then
            cd dist && zip -r ../OutDist/NerazimNet_macOS.zip NerazimNet.app && cd ..
          else
            cp resources/images/nerazimnet_logo.png dist/nerazimnet.png
            cat > dist/nerazimnet.desktop <<'EOF'
          [Desktop Entry]
          Name=NerazimNet
          Comment=FRP-based reverse tunnel manager
          Exec=nerazimnet
          Icon=nerazimnet
          Type=Application
          Categories=Network;
          EOF
            tar -czf OutDist/NerazimNet_Linux.tar.gz -C dist NerazimNet nerazimnet.png nerazimnet.desktop
          fi

      - name: Upload package artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: nerazimnet-package-${{ runner.os }}
          path: OutDist/
